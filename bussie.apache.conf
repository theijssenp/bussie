# Bussie.hodc.nl — Apache VirtualHost
# Proxy naar Python backend op :8900

<VirtualHost *:80>
    ServerName bussie.hodc.nl

    # Statische bestanden direct via backend (die serveert ook frontend)
    ProxyPreserveHost On
    ProxyPass / http://localhost:8900/
    ProxyPassReverse / http://localhost:8900/

    # WebSocket support (voor toekomstige live updates)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*) ws://localhost:8900/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/bussie_error.log
    CustomLog ${APACHE_LOG_DIR}/bussie_access.log combined
</VirtualHost>