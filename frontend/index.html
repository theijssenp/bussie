<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bussie — Live buskaart Groningen</title>
  <meta name="description" content="Een schattige isometrische kaart van het openbaar vervoer in Groningen, live in beweging.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* === Reset & base === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #dee9f0;
      --fg: #2b3038;
      --muted: rgba(43,48,56,0.55);
      --panel: rgba(255,255,255,0.80);
      --panel-border: rgba(0,0,0,0.08);
      --accent: #7fb4d6;
      --accent-soft: rgba(127,180,214,0.12);
      --frost-soft: blur(2px);
      --frost: blur(8px);
      --frost-strong: blur(10px);
      --shadow: 0 6px 20px rgba(20,28,40,0.10);
      --radius: 12px;
      --font: "Sora Variable", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono Variable", ui-monospace, monospace;
    }
    :root[data-theme="dark"] {
      --bg: #10151d;
      --fg: #e7ecf2;
      --muted: rgba(231,236,242,0.50);
      --panel: rgba(22,28,38,0.80);
      --panel-border: rgba(255,255,255,0.12);
      --shadow: 0 6px 20px rgba(0,0,0,0.30);
    }
    @media (pointer: coarse) {
      :root {
        --frost-soft: none;
        --frost: none;
        --frost-strong: none;
        --panel: rgba(255,255,255,0.95);
      }
      :root[data-theme="dark"] {
        --panel: rgba(22,28,38,0.95);
      }
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    /* === Boot loader === */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: var(--bg); transition: opacity 0.35s;
    }
    #boot-inner { width: 172px; text-align: center; }
    #boot-title { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); opacity: 0.9; }
    #boot-track { margin: 15px 0 9px; height: 3px; border-radius: 3px; background: rgba(20,30,45,0.12); overflow: hidden; }
    #boot-bar { height: 100%; width: 0%; border-radius: 3px; background: var(--accent); transition: width 0.15s; }
    #boot-msg { font-size: 11px; letter-spacing: 0.04em; color: var(--fg); opacity: 0.5; }

    /* === Canvas === */
    #kaart { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #kaart:active { cursor: grabbing; }

    /* === UI panels === */
    .panel {
      position: absolute;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: var(--frost);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      user-select: none;
    }

    /* Title panel (top-left) */
    #titel-panel {
      top: 16px; left: 16px;
      padding: 10px 14px;
    }
    #titel-panel h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    #titel-panel h1 span { color: var(--accent); }
    #status-regel { font-size: 12px; margin-top: 2px; color: var(--muted); }
    #status-regel .live { color: #2da44e; font-weight: 600; }
    #status-regel .live::before { content: "●"; margin-right: 3px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Controls — rechts, horizontaal, boven het busoverzicht */
    #controls {
      position: absolute;
      top: 16px; right: 16px;
      display: flex; gap: 6px;
    }
    .knop {
      padding: 6px 10px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: var(--frost);
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      color: var(--fg);
      box-shadow: var(--shadow);
      transition: background 0.15s;
    }
    .knop:hover { background: var(--accent-soft); }
    .knop.actief { border-color: var(--accent); color: var(--accent); }

    /* Lijnbadge — kleur komt uit de GTFS, dus inline gezet */
    .lijn-badge {
      display: inline-block;
      background: var(--accent); color: #fff;
      font-family: var(--mono);
      font-weight: 700; font-size: 12px;
      padding: 2px 7px; border-radius: 6px;
      min-width: 30px; text-align: center;
      letter-spacing: -0.02em;
    }

    /* Bus info popup */
    #bus-info {
      position: absolute;
      display: none;
      padding: 10px 12px;
      width: 214px;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
    }
    #bus-info .kop {
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px; margin-bottom: 6px;
      border-bottom: 1px solid var(--panel-border);
    }
    #bus-info .kop .bestemming {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #bus-info .veld {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 8px; color: var(--muted); line-height: 1.7;
    }
    #bus-info .veld strong { color: var(--fg); font-weight: 600; }
    #bus-info .veld.zacht { font-size: 11px; opacity: 0.75; }
    #bus-info .veld.volgende {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas: "kop kop" "naam afstand";
      margin: 2px 0 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--accent-soft);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    #bus-info .veld.volgende strong {
      grid-area: naam;
      font-size: 12px; text-transform: none; letter-spacing: 0;
    }
    #bus-info .veld.volgende span { grid-area: afstand; font-variant-numeric: tabular-nums; }

    /* Plaatsenkiezer */
    #steden {
      position: absolute;
      top: 60px; right: 16px;
      width: 244px;
      display: none;
      padding: 8px;
      overflow: hidden;
    }
    #steden-zoek {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--fg);
      font-family: var(--font);
      font-size: 13px;
    }
    #steden-zoek::placeholder { color: var(--muted); }
    #steden-zoek:focus { outline: none; border-color: var(--accent); }
    #steden-lijst {
      max-height: min(50vh, 420px);
      overflow-y: auto;
      margin-top: 6px;
    }
    #steden-lijst .plaats {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      padding: 6px 8px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s;
    }
    #steden-lijst .plaats:hover,
    #steden-lijst .plaats.actief { background: var(--accent-soft); }
    #steden-lijst .plaats .naam {
      font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #steden-lijst .plaats .inwoners {
      font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #steden-lijst .leeg { padding: 10px 8px; font-size: 12px; color: var(--muted); }

    /* Lijn filter dropdown */
    #lijn-filter {
      position: absolute;
      top: 60px; right: 16px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      display: none;
      padding: 6px;
      width: 244px;
    }
    #lijn-filter .filter-kop {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px 8px;
      font-size: 13px; font-weight: 700;
    }
    #lijn-filter .filter-reset {
      border: 0; background: none; cursor: pointer;
      font-family: var(--font); font-size: 11px; color: var(--accent);
    }
    #lijn-filter .filter-reset:disabled { color: var(--muted); cursor: default; }
    #lijn-filter .lijn-item {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s, opacity 0.12s;
    }
    #lijn-filter .lijn-item:hover { background: var(--accent-soft); }
    #lijn-filter .lijn-item.verborgen { opacity: 0.32; }
    #lijn-filter .lijn-naam {
      flex: 1; font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #lijn-filter .lijn-aantal {
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* Theme toggle */
    #thema-knop { font-size: 16px; padding: 8px 10px; }

    /* Loading indicator */
    #laden {
      position: absolute; bottom: 16px; left: 16px;
      font-size: 11px; color: var(--muted);
    }

    /* Kantelregelaar — hoe schuin we op de stad kijken */
    #kantel {
      position: absolute; bottom: 38px; left: 16px;
      display: flex; align-items: center; gap: 9px;
      padding: 7px 12px;
    }
    #kantel label {
      font-size: 11px; color: var(--muted);
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: default;
    }
    #kantel .hoek {
      font-family: var(--mono); font-size: 11px; color: var(--fg);
      min-width: 26px; text-align: right; font-variant-numeric: tabular-nums;
    }
    #kantel-slider {
      -webkit-appearance: none; appearance: none;
      width: 108px; height: 3px; margin: 0;
      border-radius: 3px; cursor: pointer;
      background: var(--panel-border);
      accent-color: var(--accent);
    }
    #kantel-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--panel);
      box-shadow: 0 1px 3px rgba(20,28,40,0.25);
    }
    #kantel-slider::-moz-range-thumb {
      width: 13px; height: 13px; border: 2px solid var(--panel);
      border-radius: 50%; background: var(--accent);
    }
    #kantel-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    /* Busoverzicht zijbalk (rechts) */
    #busoverzicht {
      position: absolute;
      top: 60px; right: 16px;
      width: 280px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      display: none;
      padding: 0;
    }
    #busoverzicht .header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 13px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
    }
    #busoverzicht .header .aantal {
      font-size: 11px; color: var(--muted); font-weight: 400;
    }
    #busoverzicht .lijn-groep {
      border-bottom: 1px solid var(--panel-border);
    }
    #busoverzicht .lijn-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.12s;
    }
    #busoverzicht .lijn-header:hover { background: var(--accent-soft); }
    #busoverzicht .lijn-header .bestemming {
      flex: 1; font-size: 12px; color: var(--fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #busoverzicht .lijn-header .count {
      font-size: 11px; color: var(--muted);
    }
    #busoverzicht .lijn-header .chevron {
      font-size: 10px; color: var(--muted);
      transition: transform 0.15s;
    }
    #busoverzicht .lijn-groep.ingeklapt .chevron { transform: rotate(-90deg); }
    #busoverzicht .bus-lijst {
      overflow: hidden;
      transition: max-height 0.2s;
    }
    #busoverzicht .lijn-groep.ingeklapt .bus-lijst { max-height: 0 !important; }
    #busoverzicht .bus-item {
      padding: 6px 14px 6px 50px;
      font-size: 12px;
      border-top: 1px solid var(--panel-border);
      cursor: pointer;
      transition: background 0.12s;
    }
    #busoverzicht .bus-item:hover { background: var(--accent-soft); }
    #busoverzicht .bus-item.geselecteerd { background: var(--accent-soft); }
    #busoverzicht .bus-item .rij {
      display: flex; justify-content: space-between; gap: 8px; color: var(--muted);
    }
    #busoverzicht .bus-item .rij span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #busoverzicht .bus-item .rij strong { color: var(--fg); font-weight: 600; }
    #busoverzicht .bus-item .rij.zacht { font-size: 11px; opacity: 0.7; }
    #busoverzicht .bus-item .status-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      margin-right: 4px; vertical-align: middle;
    }
    #busoverzicht .bus-item .status-dot.rijdt { background: #2da44e; }
    #busoverzicht .bus-item .status-dot.halte { background: #7fb4d6; }
    #busoverzicht .bus-item .status-dot.aankomend { background: #e8a030; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div id="boot">
    <div id="boot-inner">
      <div id="boot-title">Bussie</div>
      <div id="boot-track"><div id="boot-bar"></div></div>
      <div id="boot-msg">Kaart laden…</div>
    </div>
  </div>

  <canvas id="kaart"></canvas>

  <!-- Titel -->
  <div id="titel-panel" class="panel">
    <h1>Bus<span>s</span>ie</h1>
    <div id="status-regel"><span id="klok">--:--</span> · Groningen · <span class="live">live</span></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="knop" id="thema-knop" title="Thema wisselen">☀</button>
    <button class="knop" id="locatie-knop" title="Naar mijn locatie">📍</button>
    <button class="knop" id="steden-knop" title="Naar een plaats">Plaatsen</button>
    <button class="knop" id="lijnen-knop" title="Lijnfilter">Lijnen</button>
    <button class="knop" id="overzicht-knop" title="Busoverzicht">Bussen</button>
  </div>

  <!-- Plaatsen -->
  <div id="steden" class="panel">
    <input type="search" id="steden-zoek" placeholder="Zoek een plaats…" autocomplete="off">
    <div id="steden-lijst"></div>
  </div>

  <!-- Lijn filter -->
  <div id="lijn-filter" class="panel"></div>

  <!-- Busoverzicht -->
  <div id="busoverzicht" class="panel"></div>

  <!-- Bus info popup -->
  <div id="bus-info" class="panel"></div>

  <!-- Kantelregelaar -->
  <div id="kantel" class="panel">
    <label for="kantel-slider">Kanteling</label>
    <input type="range" id="kantel-slider" min="0.3" max="1" step="0.01"
           title="Hoe schuin je op de stad kijkt">
    <span class="hoek" id="kantel-hoek">17°</span>
  </div>

  <!-- Status -->
  <div id="laden"></div>

  <script type="module" src="/js/kaart.js?v=27"></script>
  <script type="module" src="/js/app.js?v=27"></script>
</body>
</html>
